
name: Build Barq Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project ZIP
        run: |
          test -f barq-project.zip || {
            echo "ERROR: Upload barq-project.zip to repository root"
            exit 1
          }

      - name: Extract project
        run: |
          mkdir -p project
          unzip -q barq-project.zip -d project
          find project -name settings.gradle.kts -print

      - name: Locate Gradle project
        id: locate
        run: |
          FILE=$(find project -name settings.gradle.kts -print -quit)
          if [ -z "$FILE" ]; then
            echo "ERROR: settings.gradle.kts not found in ZIP"
            exit 1
          fi
          echo "dir=$(dirname "$FILE")" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle assembleDebug

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Barq-Android-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
